esphome:
  name: "intex-spa-complete"
  on_boot:
    priority: -100
    then:
      - logger.log: "Intex Spa Controller started - Version 1.1.1"
      - delay: 1s
      - lambda: |-
          id(lc12s_cs).turn_off();
          id(lc12s_set).turn_off();
      - delay: 100ms
      # Read channel and first command char from preferences
      - lambda: |-
          uint8_t saved_channel = id(saved_channel_pref);
          uint8_t saved_first_cmd = id(saved_first_cmd_pref);
          
          if (saved_channel < 128 && saved_channel > 0) {
            id(used_channel) = saved_channel;
            id(first_command_char) = saved_first_cmd;
            ESP_LOGI("LC12S", "Loaded from storage - Channel: 0x%02X, First Cmd: 0x%02X", saved_channel, saved_first_cmd);
            id(configure_lc12s).execute(saved_channel);
          } else {
            ESP_LOGI("LC12S", "No valid channel saved, starting channel search...");
            id(search_mode_active) = true;
            id(channel_search_active) = true;
          }

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Enable logging
logger:
  level: DEBUG
  baud_rate: 115200

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  platform: esphome
  password: !secret ota_password

web_server:
  port: 80

# UART configuration for LC12S
uart:
  id: lc12s_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  rx_buffer_size: 256

# Preferences for storing channel info
preferences:
  flash_write_interval: 1min

# Control pins for LC12S
switch:
  - platform: gpio
    pin: GPIO19
    id: lc12s_set
    internal: true
    restore_mode: ALWAYS_OFF
    
  - platform: gpio
    pin: GPIO18
    id: lc12s_cs
    internal: true
    restore_mode: ALWAYS_OFF

  # Spa control switches
  - platform: template
    name: "Spa Power"
    id: spa_power
    icon: "mdi:power"
    lambda: return id(controller_on);
    turn_on_action:
      - lambda: |-
          id(command_to_send) |= 0x0001; // COMMAND_ON_OFF
          id(last_time_send_data) = millis();
    turn_off_action:
      - lambda: |-
          id(command_to_send) |= 0x0001; // COMMAND_ON_OFF
          id(last_time_send_data) = millis();

  - platform: template
    name: "Spa Bubbles"
    id: spa_bubbles
    icon: "mdi:chart-bubble"
    lambda: return id(bubble_on);
    turn_on_action:
      - lambda: |-
          id(command_to_send) |= 0x0020; // COMMAND_BUBBLE
          id(last_time_send_data) = millis();
    turn_off_action:
      - lambda: |-
          id(command_to_send) |= 0x0020; // COMMAND_BUBBLE
          id(last_time_send_data) = millis();

  - platform: template
    name: "Spa Heater"
    id: spa_heater
    icon: "mdi:radiator"
    lambda: return id(heater_on);
    turn_on_action:
      - lambda: |-
          id(command_to_send) |= 0x0040; // COMMAND_HEATER
          id(last_time_send_data) = millis();
    turn_off_action:
      - lambda: |-
          id(command_to_send) |= 0x0040; // COMMAND_HEATER
          id(last_time_send_data) = millis();

  - platform: template
    name: "Spa Filter"
    id: spa_filter
    icon: "mdi:air-filter"
    lambda: return id(filter_on);
    turn_on_action:
      - lambda: |-
          if (id(target_filter_time) == 2 || id(target_filter_time) == 4 || id(target_filter_time) == 6) {
            id(change_filter_time) = true;
            id(switch_off_filter) = false;
          }
    turn_off_action:
      - lambda: |-
          id(change_filter_time) = true;
          id(switch_off_filter) = true;

  - platform: template
    name: "Spa Jets"
    id: spa_jets
    icon: "mdi:water-pump"
    lambda: return id(jets_on);
    turn_on_action:
      - lambda: |-
          id(command_to_send) |= 0x0100; // COMMAND_WATER_JET
          id(last_time_send_data) = millis();
    turn_off_action:
      - lambda: |-
          id(command_to_send) |= 0x0100; // COMMAND_WATER_JET
          id(last_time_send_data) = millis();

# Select for spa model
select:
  - platform: template
    name: "Spa Model"
    id: spa_model_select
    optimistic: true
    options:
      - "28458/28462"
      - "28442/28440"
    initial_option: "28458/28462"
    on_value:
      then:
        - lambda: |-
            if (x == "28458/28462") {
              id(spa_model_28458) = true;
            } else {
              id(spa_model_28458) = false;
            }

  - platform: template
    name: "Temperature Unit"
    id: temp_unit_select
    optimistic: true
    options:
      - "Celsius"
      - "Fahrenheit"
    initial_option: "Celsius"
    on_value:
      then:
        - lambda: |-
            bool new_fahrenheit = (x == "Fahrenheit");
            if (new_fahrenheit != id(fahrenheit_celsius)) {
              id(command_to_send) |= 0x0002; // COMMAND_CELSIUS_FARENHEIT
              id(last_time_send_data) = millis();
            }

# Climate component for temperature control
# climate:
#   - platform: thermostat
#     name: "Spa Temperature"
#     id: spa_climate
#     sensor: actual_temp_sensor
#     visual:
#       min_temperature: 10
#       max_temperature: 40
#       temperature_step: 1
#     heat_action:
#       - lambda: |-
#           id(command_to_send) |= 0x0040; // COMMAND_HEATER
#           id(last_time_send_data) = millis();
#     default_preset: Home
#     preset:
#       - name: Home
#         default_target_temperature_low: 20

# Number inputs
number:
  - platform: template
    name: "Target Temperature"
    id: target_temp_number
    min_value: 10
    max_value: 40
    step: 1
    optimistic: false
    lambda: return id(target_setpoint_temp);
    set_action:
      then:
        - lambda: |-
            id(target_setpoint_temp) = (uint8_t)x;
            id(change_target_temp) = true;

  - platform: template
    name: "Filter Time"
    id: filter_time_number
    min_value: 0
    max_value: 6
    step: 2
    optimistic: false
    lambda: return id(target_filter_time);
    set_action:
      then:
        - lambda: |-
            if ((uint8_t)x == 2 || (uint8_t)x == 4 || (uint8_t)x == 6) {
              id(change_filter_time) = id(filter_on);
              id(target_filter_time) = (uint8_t)x;
            }

  - platform: template
    name: "Network ID"
    id: network_id_number
    min_value: 0
    max_value: 65535
    step: 1
    initial_value: 0xFFFF
    optimistic: true
    mode: box

  - platform: template
    name: "Channel"
    id: channel_number
    min_value: 0
    max_value: 127
    step: 1
    initial_value: 0x48
    optimistic: true
    mode: box

# Sensors
sensor:
  - platform: template
    name: "Spa Actual Temperature"
    id: actual_temp_sensor
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    device_class: temperature
    state_class: measurement

  - platform: template
    name: "Spa Target Temperature"
    id: target_temp_sensor
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    device_class: temperature

  - platform: template
    name: "Spa Error Code"
    id: error_code_sensor
    accuracy_decimals: 0

  - platform: template
    name: "Filter Setup Time"
    id: filter_setup_time_sensor
    unit_of_measurement: "h"
    accuracy_decimals: 0

# Text sensors
text_sensor:
  - platform: template
    name: "Spa Status"
    id: spa_status_text

  - platform: template
    name: "Heater State"
    id: heater_state_text
    
  - platform: template
    name: "Communication Status"
    id: comm_status_text

# Binary sensors
binary_sensor:
  - platform: template
    name: "Spa Communication"
    id: spa_communication
    device_class: connectivity

# Buttons
button:
  - platform: template
    name: "Increase Temperature"
    icon: "mdi:thermometer-plus"
    on_press:
      then:
        - lambda: |-
            id(target_setpoint_temp) = id(target_setpoint_temp) + 1;
            id(change_target_temp) = true;
            id(last_time_send_data) = millis();

  - platform: template
    name: "Decrease Temperature"
    icon: "mdi:thermometer-minus"
    on_press:
      then:
        - lambda: |-
            id(target_setpoint_temp) = id(target_setpoint_temp) - 1;
            id(change_target_temp) = true;
            id(last_time_send_data) = millis();

  - platform: template
    name: "Start Channel Search"
    on_press:
      then:
        - logger.log: "Starting channel search..."
        - lambda: |-
            id(search_mode_active) = true;
            id(channel_search_active) = true;
            id(actual_search_channel) = 0;
            id(search_data_count) = 0;
            id(last_receive_check_time) = millis();

  - platform: restart
    name: "Restart ESP"

# Global variables for spa protocol
globals:
  # Spa model selection
  - id: spa_model_28458
    type: bool
    restore_value: no
    initial_value: 'true'

  # LC12S configuration
  - id: used_channel
    type: uint8_t
    restore_value: no
    initial_value: '0x48'
    
  - id: first_command_char
    type: uint8_t
    restore_value: no
    initial_value: '0x48'

  # Preferences stored values
  - id: saved_channel_pref
    type: uint8_t
    restore_value: yes
    initial_value: '0'
    
  - id: saved_first_cmd_pref
    type: uint8_t
    restore_value: yes
    initial_value: '0'

  # Channel search variables
  - id: search_mode_active
    type: bool
    restore_value: no
    initial_value: 'false'
    
  - id: channel_search_active
    type: bool
    restore_value: no
    initial_value: 'false'
    
  - id: actual_search_channel
    type: uint8_t
    restore_value: no
    initial_value: '0'
    
  - id: search_data_count
    type: uint16_t
    restore_value: no
    initial_value: '0'
    
  - id: last_receive_check_time
    type: unsigned long
    restore_value: no
    initial_value: '0'
    
  - id: channel_change_ok
    type: uint16_t
    restore_value: no
    initial_value: '0'

  # Protocol state machine
  - id: protocol_state
    type: uint16_t
    restore_value: no
    initial_value: '0'
    
  - id: data_counter
    type: uint16_t
    restore_value: no
    initial_value: '0'

  # Spa state variables
  - id: controller_on
    type: bool
    restore_value: no
    initial_value: 'false'
    
  - id: bubble_on
    type: bool
    restore_value: no
    initial_value: 'false'
    
  - id: heater_on
    type: bool
    restore_value: no
    initial_value: 'false'
    
  - id: filter_on
    type: bool
    restore_value: no
    initial_value: 'false'
    
  - id: jets_on
    type: bool
    restore_value: no
    initial_value: 'false'

  # Temperature variables
  - id: actual_temp
    type: uint8_t
    restore_value: no
    initial_value: '0'
    
  - id: target_setpoint_temp
    type: uint8_t
    restore_value: no
    initial_value: '20'
    
  - id: actual_setpoint_temp
    type: uint8_t
    restore_value: no
    initial_value: '20'
    
  - id: change_target_temp
    type: bool
    restore_value: no
    initial_value: 'false'

  # Filter variables
  - id: target_filter_time
    type: uint8_t
    restore_value: no
    initial_value: '4'
    
  - id: actual_filter_time
    type: uint8_t
    restore_value: no
    initial_value: '0'
    
  - id: change_filter_time
    type: bool
    restore_value: no
    initial_value: 'false'
    
  - id: switch_off_filter
    type: bool
    restore_value: no
    initial_value: 'false'

  # Command variables
  - id: command_to_send
    type: uint16_t
    restore_value: no
    initial_value: '0'
    
  - id: command_received
    type: bool
    restore_value: no
    initial_value: 'false'
    
  - id: controller_loading_state
    type: uint8_t
    restore_value: no
    initial_value: '0'

  # Timing variables
  - id: last_receive_time
    type: unsigned long
    restore_value: no
    initial_value: '0'
    
  - id: last_time_send_data
    type: unsigned long
    restore_value: no
    initial_value: '0'
    
  - id: error_communication
    type: bool
    restore_value: no
    initial_value: 'false'
    
  - id: first_send
    type: bool
    restore_value: no
    initial_value: 'false'

  # Unit preference
  - id: fahrenheit_celsius
    type: bool
    restore_value: no
    initial_value: 'false'

  # Data buffers
  - id: pump_data
    type: uint8_t[19]
    restore_value: no
    
  - id: controller_data
    type: uint8_t[10]
    restore_value: no

  # Message flags
  - id: finish_pump_message
    type: bool
    restore_value: no
    initial_value: 'false'
    
  - id: finish_controller_message
    type: bool
    restore_value: no
    initial_value: 'false'

  # Error code
  - id: error_code
    type: uint8_t
    restore_value: no
    initial_value: '0'

# Scripts
script:
  # Configure LC12S with channel and network ID
  - id: configure_lc12s
    mode: queued
    parameters:
      channel: uint8_t
    then:
      - lambda: |-
          uint8_t config[19];
          uint16_t network_id = (uint16_t)id(network_id_number).state;
          
          config[0] = 0xAA;
          config[1] = 0x5A;
          config[2] = 0xB9;
          config[3] = 0x46;
          config[4] = (network_id >> 8) & 0xFF;
          config[5] = network_id & 0xFF;
          config[6] = 0x00;
          config[7] = 0x00;
          config[8] = 0x00;
          config[9] = 0x04;
          config[10] = 0x00;
          config[11] = channel;
          config[12] = 0x00;
          config[13] = 0x00;
          config[14] = 0x00;
          config[15] = 0x12;
          config[16] = 0x00;
          
          // Calculate checksum
          config[17] = 0x00;
          for(int i = 0; i < 17; i++) {
            config[17] += config[i];
          }
          
          ESP_LOGD("LC12S", "Configuring channel 0x%02X with Network ID 0x%04X", channel, network_id);
          
          id(lc12s_set).turn_off();
          delay(500);
          id(lc12s_uart).write_array(config, 18);
          delay(1000);
          id(lc12s_set).turn_on();

  # Send command to spa
  - id: send_spa_command
    mode: queued
    parameters:
      command: uint16_t
    then:
      - lambda: |-
          uint8_t send_data[8];
          
          send_data[0] = id(first_command_char);
          send_data[1] = (command >> 8) & 0xFF;
          send_data[2] = command & 0xFF;
          send_data[3] = id(controller_loading_state);
          send_data[4] = 0x00;
          send_data[5] = 0x00;
          
          // Calculate CRC
          uint16_t crc = 0;
          for(int i = 0; i < 6; i++) {
            crc = crc ^ ((uint16_t)send_data[i] << 8);
            for(int j = 0; j < 8; j++) {
              if (crc & 0x8000)
                crc = (crc << 1) ^ 0x1021;
              else
                crc <<= 1;
            }
          }
          
          send_data[6] = (crc >> 8) & 0xFF;
          send_data[7] = crc & 0xFF;
          
          ESP_LOGD("SPA", "Sending command: %02X %02X %02X %02X %02X %02X %02X %02X",
                   send_data[0], send_data[1], send_data[2], send_data[3],
                   send_data[4], send_data[5], send_data[6], send_data[7]);
          
          id(lc12s_uart).write_array(send_data, 8);

# Main processing intervals
interval:
  # Channel search loop
  - interval: 1s
    then:
      - lambda: |-
          if (id(channel_search_active) && id(search_mode_active)) {
            if (millis() - id(last_receive_check_time) > 1000) {
              id(search_data_count) = 0;
              if (id(actual_search_channel) < 128) {
                ESP_LOGD("SEARCH", "Trying channel 0x%02X", id(actual_search_channel));
                id(configure_lc12s).execute(id(actual_search_channel)++);
              } else {
                id(actual_search_channel) = 0;
                id(configure_lc12s).execute(id(actual_search_channel)++);
              }
            }
          }

  # Send keepalive/process commands
  - interval: 1600ms
    then:
      - lambda: |-
          if (!id(error_communication) && !id(search_mode_active)) {
            if (id(command_to_send) == 0) {
              id(send_spa_command).execute(0x0000);
            }
          }

  # UART data processing
  - interval: 50ms
    then:
      - lambda: |-
          // Channel search data collection
          if (id(channel_search_active) && id(search_mode_active)) {
            while (id(lc12s_uart).available()) {
              uint8_t c;
              id(lc12s_uart).read_byte(&c);
              id(last_receive_check_time) = millis();
              id(search_data_count)++;
              
              if (id(search_data_count) > 1500) {
                id(channel_change_ok)++;
                id(used_channel) = id(actual_search_channel) - 1;
                id(last_receive_time) = millis();
                id(last_time_send_data) = millis();
                
                if (id(spa_model_28458)) {
                  id(first_command_char) = id(used_channel);
                } else {
                  id(first_command_char) = id(used_channel) + 0x7F;
                }
                
                // Save to preferences
                id(saved_channel_pref) = id(used_channel);
                id(saved_first_cmd_pref) = id(first_command_char);
                
                ESP_LOGI("SEARCH", "Found channel 0x%02X, First cmd char 0x%02X", 
                         id(used_channel), id(first_command_char));
                
                id(channel_search_active) = false;
                id(search_mode_active) = false;
                return;
              }
            }
          }
          
          // Normal spa protocol processing
          if (!id(search_mode_active) && !id(finish_pump_message)) {
            while (id(lc12s_uart).available()) {
              uint8_t c;
              id(lc12s_uart).read_byte(&c);
              
              switch(id(protocol_state)) {
                case 0: // Wait for header
                  id(data_counter) = 0;
                  memset(id(pump_data), 0, 19);
                  memset(id(controller_data), 0, 10);
                  
                  if (c == id(first_command_char)) {
                    id(pump_data)[id(data_counter)++] = c;
                    id(protocol_state) = 1;
                  }
                  break;
                  
                case 1: // Collect data
                  id(pump_data)[id(data_counter)++] = c;
                  
                  // Check if this is a controller message
                  if (c == id(first_command_char) && id(data_counter) < 17 && id(data_counter) > 8) {
                    memcpy(id(controller_data), id(pump_data), 8);
                    
                    // Calculate CRC for controller message
                    uint16_t crc = 0;
                    for(int i = 0; i < 6; i++) {
                      crc = crc ^ ((uint16_t)id(controller_data)[i] << 8);
                      for(int j = 0; j < 8; j++) {
                        if (crc & 0x8000)
                          crc = (crc << 1) ^ 0x1021;
                        else
                          crc <<= 1;
                      }
                    }
                    
                    if (id(controller_data)[6] == ((crc >> 8) & 0xFF) &&
                        id(controller_data)[7] == (crc & 0xFF)) {
                      id(finish_controller_message) = true;
                      id(controller_loading_state) = id(controller_data)[3];
                    }
                    
                    id(data_counter) = 0;
                    id(pump_data)[id(data_counter)++] = c;
                  }
                  
                  // Check if full pump message received
                  if (id(data_counter) >= 17) {
                    // Calculate CRC for pump message
                    uint16_t crc = 0;
                    for(int i = 0; i < 15; i++) {
                      crc = crc ^ ((uint16_t)id(pump_data)[i] << 8);
                      for(int j = 0; j < 8; j++) {
                        if (crc & 0x8000)
                          crc = (crc << 1) ^ 0x1021;
                        else
                          crc <<= 1;
                      }
                    }
                    
                    if (id(pump_data)[15] == ((crc >> 8) & 0xFF) &&
                        id(pump_data)[16] == (crc & 0xFF)) {
                      id(protocol_state) = 0;
                      id(finish_pump_message) = true;
                    } else {
                      id(protocol_state) = 0;
                    }
                  }
                  break;
              }
            }
          }

  # Process pump data and update sensors
  - interval: 100ms
    then:
      - lambda: |-
          if (id(finish_pump_message)) {
            id(last_receive_time) = millis();
            
            // Parse pump data
            id(controller_on) = id(pump_data)[4] & 0x01;
            id(bubble_on) = id(pump_data)[4] & 0x10;
            id(heater_on) = (id(pump_data)[4] & 0x04) || (id(pump_data)[4] & 0x02);
            id(filter_on) = id(pump_data)[4] & 0x08;
            id(jets_on) = id(pump_data)[4] & 0x80;
            
            // Update heater state text
            if (id(pump_data)[4] & 0x02) {
              id(heater_state_text).publish_state("Standby");
            } else if (id(pump_data)[4] & 0x04) {
              id(heater_state_text).publish_state("Heating");
            } else {
              id(heater_state_text).publish_state("Off");
            }
            
            // Temperatures
            id(actual_temp) = id(pump_data)[5];
            id(actual_setpoint_temp) = id(pump_data)[7];
            id(actual_temp_sensor).publish_state(id(actual_temp));
            id(target_temp_sensor).publish_state(id(actual_setpoint_temp));
            
            if (!id(change_target_temp)) {
              id(target_setpoint_temp) = id(actual_setpoint_temp);
            }
            
            // Filter time
            id(actual_filter_time) = id(pump_data)[12];
            id(filter_setup_time_sensor).publish_state(id(actual_filter_time));
            if (!id(change_filter_time) && id(actual_filter_time) > 0) {
              id(target_filter_time) = id(actual_filter_time);
            }
            
            // Fahrenheit/Celsius
            id(fahrenheit_celsius) = id(pump_data)[2] & 0x01;
            if (id(fahrenheit_celsius)) {
              id(temp_unit_select).publish_state("Fahrenheit");
            } else {
              id(temp_unit_select).publish_state("Celsius");
            }
            
            // Error code
            id(error_code) = id(pump_data)[14];
            id(error_code_sensor).publish_state(id(error_code));
            
            // Command received flag
            id(command_received) = id(pump_data)[2] & 0x80;
            
            // Update switches
            id(spa_power).publish_state(id(controller_on));
            id(spa_bubbles).publish_state(id(bubble_on));
            id(spa_heater).publish_state(id(heater_on));
            id(spa_filter).publish_state(id(filter_on));
            id(spa_jets).publish_state(id(jets_on));
            
            // Process temperature setpoint changes
            if (id(change_target_temp) && 
                !(id(command_to_send) & 0x0004) && 
                !(id(command_to_send) & 0x0008)) {
              
              if (id(target_setpoint_temp) == id(actual_setpoint_temp) ||
                  (id(target_setpoint_temp) > 40 && !id(fahrenheit_celsius)) ||
                  (id(target_setpoint_temp) < 10 && !id(fahrenheit_celsius)) ||
                  (id(target_setpoint_temp) > 104 && id(fahrenheit_celsius)) ||
                  (id(target_setpoint_temp) < 50 && id(fahrenheit_celsius))) {
                id(change_target_temp) = false;
              } else if (id(target_setpoint_temp) > id(actual_setpoint_temp)) {
                id(command_to_send) |= 0x0004; // COMMAND_INCREASE
                id(last_time_send_data) = millis();
              } else if (id(target_setpoint_temp) < id(actual_setpoint_temp)) {
                id(command_to_send) |= 0x0008; // COMMAND_DECREASE
                id(last_time_send_data) = millis();
              }
            }
            
            // Process filter time changes
            if (id(change_filter_time) && !(id(command_to_send) & 0x0010)) {
              if ((id(target_filter_time) == id(actual_filter_time) && !id(switch_off_filter)) ||
                  (id(actual_filter_time) == 0 && id(switch_off_filter))) {
                id(change_filter_time) = false;
              } else {
                id(command_to_send) |= 0x0010; // COMMAND_WATER_FILTER
                id(last_time_send_data) = millis();
              }
            }
            
            // Send command if needed
            if (id(command_to_send) != 0) {
              if (id(command_received) || (millis() - id(last_time_send_data) > 2000)) {
                id(command_to_send) = 0;
              } else {
                id(send_spa_command).execute(id(command_to_send));
              }
            }
            
            id(protocol_state) = 0;
            id(first_send) = true;
            id(finish_pump_message) = false;
          }

  # Communication timeout check
  - interval: 5s
    then:
      - lambda: |-
          if (!id(search_mode_active)) {
            if (millis() - id(last_receive_time) > 5000) {
              if (!id(error_communication)) {
                ESP_LOGW("SPA", "Communication timeout with pump");
                id(spa_communication).publish_state(false);
                id(comm_status_text).publish_state("Disconnected");
                id(error_communication) = true;
                
                // For model 28442/28440, try adjusting first command char
                if (!id(spa_model_28458) && id(first_command_char) - id(used_channel) > 0x80) {
                  ESP_LOGI("SPA", "Rebasing channel to first command char");
                  id(used_channel) = id(first_command_char) - 0x80;
                  id(configure_lc12s).execute(id(used_channel));
                  id(saved_channel_pref) = id(used_channel);
                }
              }
            } else {
              if (id(error_communication)) {
                ESP_LOGI("SPA", "Communication restored with pump");
                id(spa_communication).publish_state(true);
                id(comm_status_text).publish_state("Connected");
                id(error_communication) = false;
              }
            }
            
            // If communication lost for too long, start channel search
            if (!id(first_send) && millis() - id(last_receive_time) > 6000) {
              if (id(channel_change_ok) == 1) {
                if (id(spa_model_28458)) {
                  id(actual_search_channel) = id(used_channel) + 1;
                } else {
                  id(first_command_char) = id(first_command_char) - 6;
                }
              } else if (id(channel_change_ok) > 0 && id(channel_change_ok) < 15) {
                id(last_receive_time) = millis();
                id(channel_change_ok)++;
                id(first_command_char)++;
                id(saved_first_cmd_pref) = id(first_command_char);
                ESP_LOGD("SPA", "Trying next first command char 0x%02X", id(first_command_char));
                return;
              } else if (id(channel_change_ok) > 14) {
                id(actual_search_channel) = id(used_channel) + 1;
              } else {
                id(actual_search_channel) = id(used_channel) - 10;
              }
              
              id(used_channel) = 0;
              id(channel_change_ok) = 0;
              ESP_LOGW("SPA", "Channel may have changed, starting search...");
              id(search_mode_active) = true;
              id(channel_search_active) = true;
            }
          }